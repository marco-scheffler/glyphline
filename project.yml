name: Glyphline
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    macOS: "14.0"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 7.0.0
targets:
  Glyphline:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Glyphline
    resources:
      - Glyphline/Resources
    dependencies:
      - package: GRDB
        product: GRDB
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.marcoscheffler.glyphline
      INFOPLIST_FILE: Glyphline/Info.plist
      SWIFT_VERSION: 6.0
      CODE_SIGN_STYLE: Automatic
  GlyphlineTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - GlyphlineTests
    resources:
      - GlyphlineTests/Fixtures
    dependencies:
      - target: Glyphline
    # The app target owns Glyphline/Resources, so XcodeGen will not add the same
    # file to a second resources phase. Copy the pricing catalog into the test
    # bundle so tests can load it through Bundle(for:).
    postCompileScripts:
      - name: Copy pricing catalog into test bundle
        script: |
          set -euo pipefail
          mkdir -p "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          cp "${SRCROOT}/Glyphline/Resources/pricing-v1.json" \
            "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/pricing-v1.json"
        inputFiles:
          - $(SRCROOT)/Glyphline/Resources/pricing-v1.json
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/pricing-v1.json
    settings:
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_VERSION: 6.0
