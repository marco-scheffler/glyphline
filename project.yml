name: Glyphline
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    macOS: "26.0"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 7.0.0
  # Der Updater. Die zweite und einzige weitere Abhängigkeit — bewusst nicht
  # selbst gebaut: ein Update-Mechanismus lädt Code aus dem Netz und führt ihn
  # aus, und die Signaturprüfung dahinter ist genau die Sorte Code, die man
  # nicht als Nebenprodukt eines Feature-Abends schreibt.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: 2.9.5
targets:
  Glyphline:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - Glyphline
    resources:
      - Glyphline/Resources
    # Der Test-Lauf bekommt seine Sprache fest zugewiesen. Sobald die Strings
    # durch den String-Catalog aufgelöst werden, hängt jede Assertion auf einem
    # englischen Satz an der Sprache des Prozesses — und diese Maschine läuft
    # auf Deutsch. `language: en` setzt `-AppleLanguages (en)` für den
    # Test-Prozess: die Bundle-Suche landet auf Englisch, während Locale.current
    # und damit Zahlen- und Datumsformate die Region der Maschine behalten.
    # Ohne diesen Eintrag wäre die Suite still von der eingestellten Sprache
    # abhängig, sobald die erste Übersetzung dazukommt.
    scheme:
      testTargets:
        - GlyphlineTests
      language: en
    dependencies:
      - package: GRDB
        product: GRDB
      - package: Sparkle
        product: Sparkle
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.marcoscheffler.glyphline
      MARKETING_VERSION: "1.1"
      CURRENT_PROJECT_VERSION: "2"
      INFOPLIST_FILE: Glyphline/Info.plist
      SWIFT_VERSION: 6.0
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: 7YN7YUH475
      # Notarisierung setzt die Hardened Runtime voraus — ohne sie lehnt der
      # Notary-Service ab. Sie hier und nicht nur im Release-Skript zu setzen
      # heißt: der tägliche Debug-Build läuft unter denselben Regeln wie das,
      # was am Ende verteilt wird. Sonst fällt eine Unverträglichkeit erst beim
      # Verteilen auf, wenn niemand mehr damit rechnet.
      ENABLE_HARDENED_RUNTIME: YES
  GlyphlineTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - GlyphlineTests
    resources:
      - GlyphlineTests/Fixtures
    dependencies:
      - target: Glyphline
    settings:
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_VERSION: 6.0
      # Die App läuft mit Hardened Runtime, deren Library Validation nur Code
      # lädt, der vom selben Team signiert ist. Ein anders signiertes
      # Test-Bundle lässt sich deshalb gar nicht erst einschleusen.
      DEVELOPMENT_TEAM: 7YN7YUH475
      CODE_SIGN_STYLE: Automatic
