name: Glyphline
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    macOS: "14.0"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 7.0.0
targets:
  Glyphline:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Glyphline
    resources:
      - Glyphline/Resources
    dependencies:
      - package: GRDB
        product: GRDB
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.marcoscheffler.glyphline
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      INFOPLIST_FILE: Glyphline/Info.plist
      SWIFT_VERSION: 6.0
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: 7YN7YUH475
      # Notarisierung setzt die Hardened Runtime voraus — ohne sie lehnt der
      # Notary-Service ab. Sie hier und nicht nur im Release-Skript zu setzen
      # heißt: der tägliche Debug-Build läuft unter denselben Regeln wie das,
      # was am Ende verteilt wird. Sonst fällt eine Unverträglichkeit erst beim
      # Verteilen auf, wenn niemand mehr damit rechnet.
      ENABLE_HARDENED_RUNTIME: YES
  GlyphlineTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - GlyphlineTests
    resources:
      - GlyphlineTests/Fixtures
    dependencies:
      - target: Glyphline
    settings:
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_VERSION: 6.0
      # Die App läuft mit Hardened Runtime, deren Library Validation nur Code
      # lädt, der vom selben Team signiert ist. Ein anders signiertes
      # Test-Bundle lässt sich deshalb gar nicht erst einschleusen.
      DEVELOPMENT_TEAM: 7YN7YUH475
      CODE_SIGN_STYLE: Automatic
